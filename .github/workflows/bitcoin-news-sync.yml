name: Sync Bitcoin X News

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "24"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch crypto news (X + @TheRiser100x)
        run: python scripts/fetch-crypto-news.py

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto-news.json data/bitcoin-news.json
          if git diff --staged --quiet; then
            echo "No news changes."
          else
            git commit -m "Aggiorna sessione news Bitcoin da X"
            git push origin HEAD:${{ github.ref_name }}
          fi