name: Facebook Auto Post — feed + story

on:
  # Schedule disattivato — usa social-auto-post.yml (orchestratore unificato)
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot 0–19 (vuoto = rileva da orario Roma)"
        required: false
        default: ""
      dry_run:
        description: "Solo test, non pubblicare"
        required: false
        default: false
        type: boolean
      no_story:
        description: "Solo feed, senza story"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: "24"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Post to Facebook (feed + story, 20/giorno)
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          ARGS="--auto"
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            ARGS="$ARGS --slot ${{ github.event.inputs.slot }}"
          else
            ARGS="$ARGS --now"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.no_story }}" = "true" ]; then
            ARGS="$ARGS --no-story"
          fi
          python scripts/post-to-facebook.py $ARGS

      - name: Commit schedule state
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/facebook-schedule.json data/story-schedule.json
          if git diff --staged --quiet; then
            echo "Nessun aggiornamento schedule."
          else
            git commit -m "chore: aggiorna facebook-schedule dopo auto-post feed+story"
            git push origin HEAD:${{ github.ref_name }}
          fi