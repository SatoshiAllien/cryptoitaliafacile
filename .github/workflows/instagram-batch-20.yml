name: Instagram Batch 20 — feed only

on:
  workflow_dispatch:
    inputs:
      start:
        description: "ID contenuto da cui riprendere (1-20)"
        required: false
        default: "1"
      delay:
        description: "Secondi tra un post e il successivo"
        required: false
        default: "120"
      dry_run:
        description: "Solo test"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: "24"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tzdata Pillow

      - name: Verify batch manifest
        run: python scripts/publish-instagram-batch-20.py --verify

      - name: Publish batch feed only (resume-safe)
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          ARGS="--start ${{ github.event.inputs.start }} --delay ${{ github.event.inputs.delay }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/publish-instagram-batch-20.py $ARGS

      - name: Commit publish state
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram-batch-20-state.json
          if git diff --staged --quiet; then
            echo "Nessun aggiornamento stato."
          else
            git commit -m "chore: instagram batch-20 feed publish progress"
            git push origin HEAD:${{ github.ref_name }}
          fi