name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare lean site artifact
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='desktop' \
            --exclude='assets/audio' \
            --exclude='assets/video' \
            --exclude='assets/img/instagram/stories' \
            --exclude='assets/img/facebook/stories' \
            --exclude='assets/img/instagram/posts/professional-batch' \
            --exclude='assets/img/facebook/posts/professional-batch' \
            --exclude='_site' \
            ./ _site/
          echo "Artifact size:"
          du -sh _site
          find _site -type f | wc -l

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 15

      - name: Retry deploy if GitHub Pages sync failed
        if: failure() && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        timeout-minutes: 15