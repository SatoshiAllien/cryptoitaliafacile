name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUILD_DIR: _site

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site artifact
        run: |
          mkdir -p "${BUILD_DIR}"
          # Static site — no build step; publish repo root minus non-web assets
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='desktop' \
            --exclude='assets/audio' \
            --exclude='assets/video' \
            --exclude='assets/img/instagram/stories' \
            --exclude='assets/img/facebook/stories' \
            --exclude='assets/img/instagram/posts/professional-batch' \
            --exclude='assets/img/facebook/posts/professional-batch' \
            --exclude="${BUILD_DIR}" \
            ./ "${BUILD_DIR}/"
          echo "Artifact size:"
          du -sh "${BUILD_DIR}"
          echo "File count:"
          find "${BUILD_DIR}" -type f | wc -l

      - name: Verify artifact contains updated files
        run: |
          set -e
          test -f "${BUILD_DIR}/index.html"
          test -f "${BUILD_DIR}/css/style.css"
          test -f "${BUILD_DIR}/js/main.js"
          test -f "${BUILD_DIR}/js/components.js"
          test -f "${BUILD_DIR}/js/site-config.js"
          test -f "${BUILD_DIR}/js/article-content-en.js"
          test -f "${BUILD_DIR}/news/en/index.html"
          test -d "${BUILD_DIR}/icons"
          test -f "${BUILD_DIR}/icons/home.svg"
          test -f "${BUILD_DIR}/js/icons.js"
          grep -q "20260703-navtabs" "${BUILD_DIR}/index.html"
          grep -q "iconImg" "${BUILD_DIR}/js/components.js"
          echo "✓ All required files present in ${BUILD_DIR}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 15

      - name: Retry deploy after sync failure
        if: failure() && steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        if: failure() && steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        timeout-minutes: 15

      - name: Publish site URL
        if: success()
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          if [ -z "$URL" ]; then URL="${{ steps.deployment_retry.outputs.page_url }}"; fi
          echo "Site deployed: ${URL:-https://satoshiallien.github.io/cryptoitaliafacile/}"