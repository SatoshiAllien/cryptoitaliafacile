name: Social Auto Post — unified orchestrator

on:
  schedule:
    - cron: "0,30 5-20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo test"
        required: false
        default: false
        type: boolean
      limit:
        description: "Post max per run"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: social-auto-post
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Reset circuit breaker
        run: python scripts/publish_orchestrator.py --reset-circuit

      - name: Generate publish queue
        run: python scripts/generate_publish_queue.py --days 14

      - name: Run orchestrator
        id: orchestrator
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          GITHUB_ACTIONS: true
        run: |
          ARGS="--auto --limit ${{ github.event.inputs.limit || '2' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/publish_orchestrator.py $ARGS

      - name: Commit queue state
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/publish-queue.json data/publish-log.jsonl data/instagram-schedule.json data/facebook-schedule.json
          if git diff --staged --quiet; then
            echo "Nessun aggiornamento stato."
          else
            git commit -m "chore: social auto-post queue update [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi