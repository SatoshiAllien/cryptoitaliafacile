name: Story Publish Test (FB + IG)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug articolo story"
        required: false
        default: "comprare-bitcoin-prima-volta"
      slot:
        description: "Variante story 0-2"
        required: false
        default: "0"

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Sync story music
        run: python scripts/fetch-mixkit-story-music.py || true

      - name: Publish story FB + IG
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python scripts/post-story-only.py \
            --slug "${{ github.event.inputs.slug }}" \
            --slot "${{ github.event.inputs.slot }}"

      - name: Commit published story videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video/stories/published/instagram/ || true
          if git diff --staged --quiet; then
            echo "Nessun video story da committare."
          else
            git commit -m "chore: story video pubblicato (${{ github.event.inputs.slug }})"
            git push origin HEAD:${{ github.ref_name }}
          fi